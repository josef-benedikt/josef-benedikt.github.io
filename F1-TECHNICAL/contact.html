<div class="content">
  <h1>Got any questions or feedback? Don't hesitate to reach us out!</h1>

<div class="input">
    <form id="contactForm" action="submit_page" method="POST">
        <label for="Name">Name</label><br>
        <input type="text" id="Name" name="Name" placeholder="Name"><br><br>

        <label for="Message">Message</label><br>
        <textarea id="Message" name="Message" placeholder="Enter your message"></textarea>
        <br><br>

        <button type="submit" class="submit">Submit</button>
    </form> 
</div>

<script>
    const myForm = document.getElementById('contactForm');
    myForm.addEventListener('submit', function(event) {
        event.preventDefault(); 
        alert("Thank you! Your message has been sent.");
        myForm.reset();
    });
</script>

<p id="responseMessage" style="display:none; color: green; font-weight: bold; margin-top: 10px;">
    Thank you! Your message has been sent.
</p>
