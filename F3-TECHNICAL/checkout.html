<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Desserts by Josef</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <div class="header">
        <img src="https://images.seeklogo.com/logo-png/29/2/sweet-dessert-logo-png_seeklogo-298730.png" class="logo">
        <h2>Desserts by Josef</h2> 
        <h3>High Quality and Affordable!</h3>
    </div>
</header>
    
<nav class="sidebar">
    <h2>Navigation Bar</h2>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact Us</a></li>
        <li><a href="profile.html">User Profile</a></li>
        <li><a href="cart.html">Shopping Cart</a></li>
    </ul>
</nav>

<div class="content">
    <h1>Checkout Summary</h1>
    
    <div id="orderSummary" class="order-details">
        <p>Loading your order...</p>
    </div>

    <hr>
    <h2 id="displayTotal">Total: P0</h2>

    <form id="checkoutForm" class="form-columns">
        <div class="column">
            <label for="payment">Choose Payment Method</label>
            <select name="payment" id="payment" class="payment">
                <option value="GCash">GCash</option>
                <option value="PayMaya">PayMaya</option>
                <option value="PayPal">PayPal</option>
                <option value="Cash On Delivery">Cash On Delivery</option>
                <option value="Credit Card">Credit Card</option>
            </select>

            <div class="button-container">
                <button type="submit" id="submitBtn" class="submit">Complete Purchase</button>
            </div>
        </div>
    </form>
    <p id="statusMessage" style="text-align: center; font-weight: bold;"></p>
</div>

<footer>
    <p class="footer-about">Desserts by Josef - Copyright 2026</p>
</footer>

<script>

    window.onload = function() {
        const rawData = localStorage.getItem('userCart');
        if (rawData) {
            const data = JSON.parse(rawData);
            const summaryDiv = document.getElementById('orderSummary');
            
            summaryDiv.innerHTML = `
                <p>Vanilla Ice Cream (${data.vanilla.qty}) - P${data.vanilla.qty * data.vanilla.price}</p>
                <p>Chocolate Chip Cookies (${data.cookie.qty}) - P${data.cookie.qty * data.cookie.price}</p>
            `;
            document.getElementById('displayTotal').innerText = "Total: P" + data.total;
        }
    };

    
    const checkoutForm = document.getElementById('checkoutForm');
    checkoutForm.addEventListener('submit', async function(event) {
        event.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('statusMessage');
        
        btn.disabled = true;
        btn.innerText = "Processing Order...";
        status.innerText = "Verifying payment details...";

        try {
            
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            status.style.color = "green";
            status.innerText = "Success! Your desserts are on the way.";
            
            
            localStorage.removeItem('userCart');

            setTimeout(() => {
                window.location.href = "index.html";
            }, 2000);
            
        } catch (error) {
            status.style.color = "red";
            status.innerText = "There was an error processing your request.";
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
