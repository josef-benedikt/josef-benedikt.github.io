<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Desserts by Josef</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <div class="header">
        <img src="https://images.seeklogo.com/logo-png/29/2/sweet-dessert-logo-png_seeklogo-298730.png" class="logo">
        <h2>Desserts by Josef</h2> 
        <h3>High Quality and Affordable!</h3>
    </div>
</header>
    
<nav class="sidebar">
    <h2>Navigation Bar</h2>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact Us</a></li>
        <li><a href="profile.html">User Profile</a></li>
        <li><a href="cart.html">Shopping Cart</a></li>
</nav>

<div class="content">
    <h1>Checkout Summary</h1>
    
    <div id="orderSummary" class="order-details">
        <p>Loading your order...</p>
    </div>

    <hr>
    <h2 id="displayTotal">Total: P0</h2>

    <form id="checkoutForm" class="form-columns">
        <div class="column">
            <label for="payment">Choose Payment Method</label>
            <select name="payment" id="payment" class="payment">
                <option value="GCash">GCash</option>
                <option value="PayMaya">PayMaya</option>
                <option value="PayPal">PayPal</option>
                <option value="Cash On Delivery">Cash On Delivery</option>
                <option value="Credit Card">Credit Card</option>
            </select>

            <div class="button-container">
                <button type="submit" id="submitBtn" class="submit">Complete Purchase</button>
            </div>
        </div>
    </form>
    <p id="statusMessage" style="text-align: center; font-weight: bold;"></p>
</div>

<footer>
    <p class="footer-about">Desserts by Josef - Copyright 2026</p>
</footer>

<script>

   window.onload = function() {
    const rawData = localStorage.getItem('userCart');
    const summaryDiv = document.getElementById('orderSummary');
    
    if (rawData) {
        const data = JSON.parse(rawData);
        let html = "";

        
        if(data.vanilla.qty > 0) html += `<p>Vanilla Ice Cream (${data.vanilla.qty}) - P${data.vanilla.qty * 100}</p>`;
        if(data.cookie.qty > 0)  html += `<p>Chocolate Chip Cookie (${data.cookie.qty}) - P${data.cookie.qty * 50}</p>`;
        if(data.cake.qty > 0)    html += `<p>Dark Chocolate Cake (${data.cake.qty}) - P${data.cake.qty * 75}</p>`;
        if(data.blue.qty > 0)    html += `<p>Blueberry Muffin (${data.blue.qty}) - P${data.blue.qty * 80}</p>`;
        if(data.peach.qty > 0)   html += `<p>Peach Muffin (${data.peach.qty}) - P${data.peach.qty * 80}</p>`;
        
        summaryDiv.innerHTML = html || "<p>Your cart is empty.</p>";
        document.getElementById('displayTotal').innerText = "Total: P" + data.total;
    }
};


document.getElementById('checkoutForm').addEventListener('submit', async function(event) {
    event.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.innerText = "Processing...";
    
    await new Promise(resolve => setTimeout(resolve, 2000));
    
    window.location.href = "receipt.html";
});
</script>

</body>
</html>
